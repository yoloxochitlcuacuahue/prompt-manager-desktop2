name: Build Prompt Manager Desktop

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Prisma migration (ignore error if already migrated)
        run: npx prisma migrate deploy || true

      - name: Build frontend
        run: npm run build

      - name: Package Electron app
        run: npm run make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: prompt-manager-installer
          path: release/
